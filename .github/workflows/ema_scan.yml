name: 200 EMA scan

# Aimed at 16:45 Toronto time, Mon-Fri (best started by cron-job.org through
# the workflow_dispatch API, since GitHub's timer often runs late). GitHub's
# timer is UTC, so there is one line per daylight-saving season: the run that
# lands before the 4pm close finds no new close and does nothing, and
# data/scan_state.json stops any later run sending the same close twice.
# No email goes out on market holidays.
on:
  schedule:
    - cron: "45 20 * * 1-5"   # 4:45pm EDT (3:45pm EST: before the close, does nothing)
    - cron: "45 21 * * 1-5"   # 4:45pm EST (5:45pm EDT: already sent, does nothing)
    - cron: "45 22 * * 1-5"   # late backup, 6:45pm EDT / 5:45pm EST
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if already sent today or no new close (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: scanwire
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Send EMA scan email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SCAN_RECIPIENT_EMAIL: ${{ secrets.SCAN_RECIPIENT_EMAIL }}
          PYTHONPATH: src
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m scanwire.main --force
          else
            python -m scanwire.main
          fi

      - name: Commit scan record
        run: |
          if [ -z "$(git status --porcelain data/scan_state.json)" ]; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_state.json
          git commit -m "Update scanwire state [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); rebasing onto latest remote and retrying."
            git pull --rebase -X theirs origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push updated state after 5 attempts."
          exit 1
