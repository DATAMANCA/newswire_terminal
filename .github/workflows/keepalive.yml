name: Keepalive

# Runs monthly to guarantee repo-level activity, which resets GitHub's
# repo-wide 60-day inactivity clock that would otherwise auto-disable
# every scheduled workflow in this repo (poll.yml and watchdog.yml included).

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Touch keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-marker

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain .github/keepalive-marker)" ]; then
            echo "Marker unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-marker
          git commit -m "Keepalive [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); rebasing onto latest remote and retrying."
            git pull --rebase -X theirs origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push keepalive marker after 5 attempts."
          exit 1
