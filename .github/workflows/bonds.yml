name: Bond yields digest

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset from poll.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bondwire-poll
  cancel-in-progress: false

jobs:
  bonds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Send bond digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BOND_RECIPIENT_EMAIL: ${{ secrets.BOND_RECIPIENT_EMAIL }}
          PYTHONPATH: src
        run: python -m bondwire.main

      - name: Commit updated snapshot
        run: |
          if [ -z "$(git status --porcelain data/bond_state.json)" ]; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bond_state.json
          git commit -m "Update bondwire snapshot [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); rebasing onto latest remote and retrying."
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push updated snapshot after 5 attempts."
          exit 1
