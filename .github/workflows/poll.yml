name: Poll newswire

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: newswire-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run poll
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PYTHONPATH: src
        run: python -m newswire.main

      - name: Commit updated state
        run: |
          if [ -z "$(git status --porcelain data/state.json data/cik_cache.json)" ]; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/cik_cache.json
          git commit -m "Update newswire state [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); rebasing onto latest remote and retrying."
            git pull --rebase -X theirs origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push updated state after 5 attempts."
          exit 1

      # Sector emails for the whole market (newswire.market). They run after the
      # watchlist digest so a problem here can never hold that up. Their memory
      # lives in the Actions cache rather than git, so the repo doesn't grow.
      - name: Restore sector-email memory
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: data/market_state.json
          key: market-state-${{ github.run_id }}
          restore-keys: market-state-

      - name: Run sector emails
        if: always()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PYTHONPATH: src
        run: python -m newswire.market.main

      - name: Save sector-email memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/market_state.json
          key: market-state-${{ github.run_id }}-${{ github.run_attempt }}
